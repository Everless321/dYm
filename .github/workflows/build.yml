name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            platform: mac
          # Intel Mac：macos-13 已于 2025-12 退役，现在的 Intel 标签是 macos-15-intel，
          # GitHub 声明可用到 2027-08，之后 Actions 不再提供 x86_64 macOS 环境。
          # 用原生 Intel runner 而不是在 arm64 上交叉编译，是因为 npmRebuild: false ——
          # better-sqlite3 只由 npm ci 的 postinstall 按宿主架构编译一次。
          - os: macos-15-intel
            arch: x64
            platform: mac
          - os: windows-latest
            arch: x64
            platform: win
          - os: ubuntu-latest
            arch: x64
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      # 把 electron / electron-builder 的下载缓存放到固定路径，便于跨次构建复用
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 24 起自带 npm 11，与本地开发环境一致。停在 22（npm 10）时，
          # 任何人在本地用 npm 11 跑一次 npm i 重写 lock 都会让 npm ci 报不同步
          node-version: 24
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Build
        run: npm run build

      - name: Cache ffmpeg binaries
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/download-ffmpeg.mjs') }}

      - name: Fetch ffmpeg (bundled into app)
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          case "$MATRIX_PLATFORM" in
            mac) P=macos ;;
            win) P=windows ;;
            linux) P=linux ;;
          esac
          case "$MATRIX_ARCH" in
            x64) A=amd64 ;;
            arm64) A=arm64 ;;
          esac
          node scripts/download-ffmpeg.mjs --platform "$P" --arch "$A"

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
        timeout-minutes: 30

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dym-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 不能用 merge-multiple：两个 mac 架构产出的 latest-mac.yml 同名，
      # 平铺时会互相覆盖，导致一半 Mac 用户自动更新拿到错架构的包。
      # 这里每个 artifact 落到各自子目录，再由脚本合并后汇总。
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Merge mac update manifests
        run: |
          npm install --no-save --no-audit --no-fund js-yaml
          node .github/scripts/merge-latest-mac.mjs artifacts release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
