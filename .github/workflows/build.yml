name: Build

on:
  push:
    tags:
      - 'v*'
  # 夜间版：每天北京时间 04:00 构建一次 main，发布到滚动的 nightly 预发布
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: '发布为夜间版（即使 main 没有新提交也构建）'
        type: boolean
        default: false

jobs:
  # 决定这次是不是夜间版、版本号是什么，以及 main 没变时跳过整次构建
  precheck:
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.check.outputs.nightly }}
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE_NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$FORCE_NIGHTLY" = true ]; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            # 必须是合法 semver：electron-updater 启动时会解析 app.getVersion()
            echo "version=$(node -p 'require("./package.json").version')-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi
          # 只有定时触发才去重：nightly 标签已指向当前提交，说明昨天之后 main 没有新提交
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$EVENT" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "main 自上次夜间版后没有新提交，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            platform: mac
          # Intel Mac：macos-13 已于 2025-12 退役，现在的 Intel 标签是 macos-15-intel，
          # GitHub 声明可用到 2027-08，之后 Actions 不再提供 x86_64 macOS 环境。
          # 用原生 Intel runner 而不是在 arm64 上交叉编译，是因为 npmRebuild: false ——
          # better-sqlite3 只由 npm ci 的 postinstall 按宿主架构编译一次。
          - os: macos-15-intel
            arch: x64
            platform: mac
          - os: windows-latest
            arch: x64
            platform: win
          - os: ubuntu-latest
            arch: x64
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      # 把 electron / electron-builder 的下载缓存放到固定路径，便于跨次构建复用
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 24 起自带 npm 11，与本地开发环境一致。停在 22（npm 10）时，
          # 任何人在本地用 npm 11 跑一次 npm i 重写 lock 都会让 npm ci 报不同步
          node-version: 24
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      # 放在 build 之前：安装包文件名和应用内显示的版本都取自 package.json
      - name: Set nightly version
        if: needs.precheck.outputs.nightly == 'true'
        # Windows 默认是 PowerShell，$VERSION 会被当成 PowerShell 变量而不是环境变量
        shell: bash
        env:
          VERSION: ${{ needs.precheck.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Build
        run: npm run build

      - name: Cache ffmpeg binaries
        uses: actions/cache@v5
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/download-ffmpeg.mjs') }}

      - name: Fetch ffmpeg (bundled into app)
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          case "$MATRIX_PLATFORM" in
            mac) P=macos ;;
            win) P=windows ;;
            linux) P=linux ;;
          esac
          case "$MATRIX_ARCH" in
            x64) A=amd64 ;;
            arm64) A=arm64 ;;
          esac
          node scripts/download-ffmpeg.mjs --platform "$P" --arch "$A"

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
        timeout-minutes: 30

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never

      # 排除 builder-debug.yml：electron-builder 的调试转储，每个平台都会生成一份
      # 同名文件。它会泄露构建路径与配置，对用户也没用，此前一直被误发到 Release 里。
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dym-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史与 tag 对象才能读出 annotated tag 的说明正文
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # checkout 检出 tag 时建的是指向 commit 的轻量 ref，annotated tag 对象不会被带下来，
      # 于是 release-notes.sh 判定「不是 tag 对象」并回退到提交消息 —— v2.7.0 就这么翻过车。
      # 显式再取一次 tag 对象，把本地那个轻量 ref 覆盖掉。
      - name: Fetch annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-notes.sh "$TAG" | tee release-notes.md

      # 不能用 merge-multiple：两个 mac 架构产出的 latest-mac.yml 同名，
      # 平铺时会互相覆盖，导致一半 Mac 用户自动更新拿到错架构的包。
      # 这里每个 artifact 落到各自子目录，再由脚本合并后汇总。
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Merge mac update manifests
        run: |
          # 钉死大版本：不钉的话会装到 js-yaml 5，与本地开发时解析到的
          # 传递依赖 4.x 不是同一份，容易出现本地能跑、CI 挂掉
          npm install --no-save --no-audit --no-fund js-yaml@4
          node .github/scripts/merge-latest-mac.mjs artifacts release-files

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          draft: false
          # 正文来自 tag 说明；generate_release_notes 仍开着，它会在正文之后
          # 追加 Full Changelog 对比链接（本仓库无 PR，它只能生成这一行）
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 通知失败不该让已经发布成功的版本变成红叉，所以 continue-on-error。
      # 未配置 secrets 时脚本自行跳过，fork 出去的仓库不会因此报错。
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/notify-telegram.sh

  # 夜间版发布到同一个 nightly 预发布里，原地更新而不是每天新建，
  # 否则关注 Releases 的人每天都会收到一封通知
  nightly:
    needs: [precheck, build]
    if: needs.precheck.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 要用历史和 tag 生成「自上个正式版以来的改动」
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # 不上传 latest*.yml 和 .blockmap：它们是自动更新用的，夜间版不参与自动更新。
      # 正式版用户不受影响：electron-updater 只看 releases/latest，预发布不算在内
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.precheck.outputs.version }}
        run: |
          set -euo pipefail
          mkdir files
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} files/ \;
          ls files

          stable=$(git describe --tags --abbrev=0 --match 'v*')
          {
            echo "main 分支的每日自动构建（$VERSION），没有经过发版测试，仅供尝鲜。"
            echo
            echo "夜间版不会自动更新，需要新版时请回到这里手动下载。"
            echo
            echo "提交：$GITHUB_SHA"
            echo
            echo "自 $stable 以来的改动："
            echo
            git log --no-merges --format='- %s' "$stable..HEAD"
          } > notes.md

          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title "Nightly $VERSION" --notes-file notes.md \
              --prerelease --latest=false
          else
            gh release create nightly --title "Nightly $VERSION" --notes-file notes.md \
              --prerelease --latest=false --verify-tag
          fi

          # 先传新的再删旧的，下载链接不会出现空窗
          gh release upload nightly files/* --clobber
          gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
            [ -e "files/$name" ] || gh release delete-asset nightly "$name" -y
          done
