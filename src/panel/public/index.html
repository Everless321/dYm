<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dYm 管理端</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form id="loginForm" class="card login-card">
        <p class="brand">dYm</p>
        <h1>管理端</h1>
        <p class="muted">输入这台管理端的管理员口令。</p>
        <label>
          口令
          <input id="tokenInput" type="password" autocomplete="current-password" required />
        </label>
        <p id="loginError" class="error" hidden></p>
        <button class="primary" type="submit">进入</button>
      </form>
    </div>

    <div id="shell" hidden>
      <header class="top">
        <a class="brand" href="#/">dYm 管理端</a>
        <button id="logoutButton" class="ghost" type="button">退出</button>
      </header>
      <main id="view"></main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="modal" class="modal" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
